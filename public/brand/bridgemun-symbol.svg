<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BridgeMUN">
  <!-- BridgeMUN symbol: two towers (delegations) joined by one cable; the gold point is where they meet.
       Towers + cable also read as an "M" (MUN). Colours: azure #1580d8, sun #f7c948, white. -->
  <rect width="64" height="64" rx="15" fill="#1580d8"/>
  <path d="M17 45V17M47 45V17" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M17 22C23 35 41 35 47 22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M8 45h48" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/><circle cx="32" cy="31.8" r="5.2" fill="#f7c948" stroke="#1580d8" stroke-width="1.6"/>
</svg>
